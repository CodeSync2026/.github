name: Update Org Contributors

on:
  schedule:
    - cron: '0 0 * * *' # Berjalan otomatis setiap jam 12 malam
  workflow_dispatch: # Memungkinkan pemicu manual kapan saja

jobs:
  contribs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      - name: Aggregate Org Contributors
        uses: repo-sync/github-contributors-list@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          account: 'CodeSync2026'
          type: 'org'

      - name: Commit and Push
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "docs: update organization contributors"