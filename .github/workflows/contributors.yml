name: Update Org Contributors

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  contribs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch and Update Contributors
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const org = 'CodeSync2026';
            const TEXT_COLOR = '#DF6C4F'; // Warna kustom CodeSync (#DF6C4F)

            // 1. Ambil seluruh repositori di organisasi
            const repos = await github.paginate(github.rest.repos.listForOrg, { org });
            const contributors = new Map();

            // 2. Ambil seluruh kontributor dari tiap repositori
            for (const repo of repos) {
              try {
                const list = await github.paginate(github.rest.repos.listContributors, {
                  owner: org,
                  repo: repo.name
                });
                for (const user of list) {
                  if (user.type === 'User') {
                    contributors.set(user.login, {
                      login: user.login,
                      avatar_url: user.avatar_url,
                      html_url: user.html_url
                    });
                  }
                }
              } catch (e) {
                console.log(`Skipping repo ${repo.name}: ${e.message}`);
              }
            }

            // 3. Format tabel HTML (Tanpa Garis Bawah, Bold, Warna #DF6C4F)
            let html = '\n<table border="0" style="border: none; border-collapse: collapse;">\n  <tr>\n';
            let count = 0;
            for (const [login, user] of contributors) {
              if (count > 0 && count % 6 === 0) html += '  </tr>\n  <tr>\n';
              html += `    <td align="center" style="border: none; padding: 10px;"><a href="${user.html_url}" style="text-decoration: none;"><img src="${user.avatar_url}" width="65px" height="65px" style="border-radius: 50%; object-fit: cover;" alt="${login}"/><br /><sub style="text-decoration: none;"><font color="${TEXT_COLOR}"><b>${login}</b></font></sub></a></td>\n`;
              count++;
            }
            html += '  </tr>\n</table>\n';

            // 4. Masukkan ke dalam file profile/README.md
            const readmePath = 'profile/README.md';
            let content = fs.readFileSync(readmePath, 'utf8');
            const startTag = '<!-- ALL-CONTRIBUTORS-LIST:START -->';
            const endTag = '<!-- ALL-CONTRIBUTORS-LIST:END -->';

            const regex = new RegExp(`${startTag}[\\s\\S]*?${endTag}`);
            const replacement = `${startTag}${html}${endTag}`;

            if (regex.test(content)) {
              content = content.replace(regex, replacement);
              fs.writeFileSync(readmePath, content);
              console.log('profile/README.md updated successfully.');
            } else {
              console.log('Tags placeholder not found in profile/README.md');
            }

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update organization contributors"
          commit_user_name: "CodeSync Bot"
          commit_user_email: "hicesse31@gmail.com"
